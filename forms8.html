    <!-- USing other input tags-->
    
    <form>

        <fieldset>
            <legend> Different input tags</legend>

        <label for="textfield">Enter your text:</label>         <!-- 1. <textfeild> -->
        <input type="text" id="textfield" placeholder="Enter text here...">

        <br><br>

        <label for="radiobutton">Choose an option:</label>       <!-- 2. <radio button> -->
        <label for="option1">male</label>
        <input type="radio" id="option1" name="radiobutton" value="option1">
        <label for="option1">Female</label>
        <input type="radio" id="option1" name="radiobutton" value="option1">

        <label for="checkboxbutton">Check this box:</label>     <!-- 3. <checkbox> -->
