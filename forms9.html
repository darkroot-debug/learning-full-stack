<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <H1>Event Registration</H1>
    <form>

        <label for="name">Name :</label>
        <br> 
        <input type="text" id="name" name="name">

        <br><br>
        <label for="email">Email :</label>
        <br>
        <input type="email" id="email" name="email">

        <br><br>
        <label for="phone">Phone No. :</label>
        <br>
        <input type="tel" id="phone" name="phone">

        <br><br>
        <label for="occupation">Occupation :</label>
        <br>
        <select id="occupation" name="occupation">
            <option value="student">Student</option>
            <option value="employed">Employed</option>
            <option value="self-employed">Self-Employed</option>
            <option value="unemployed">Unemployed</option>
        </select>

        <br><br>
        <fieldset>
        <legend for="interest">Topic of Interest :</legend>
        <br>

        <input type="checkbox">
        <br>
        <label >HTML</label>

        <br>
        <br>
        <input type="checkbox">
        <br>
        <label >CSS</label>

        <br>
        <br>
        <input type="checkbox">
        <br>
        <label >JavaScript</label>
        </fieldset>

        <br><br>
        <label for="comment">comment:</label> 
        <br>
        <input type="text" id="comment" name="comment" aria-rowspan="100" aria-colspan="50" style="width:300px; height:100px;">
        <input type="submit" value="Register"></input>    

    </form>


    <h1>Job Application</h1>
    <form>

        <label for="name">Name :</label>
        <br> 
        <input type="text" id="name" name="name">

        <br><br>
        <label for="email">Email :</label>
        <br>
        <input type="email" id="email" name="email">

        <br><br>
        <label for="phone">Phone No. :</label>
        <br>
        <input type="tel" id="phone" name="phone">

        <br><br>
        <label for="resume">Resume:</label>
        <br>
        <input type="file" id="resume" name="resume">

        <br><br>
        <label for="experience">Experience :</label>
        <br>
        <input type="number" id="experience" name="experience" min="0" max="10">

        <br><br>
        <fieldset>
            <legend for="skill">Skills :</legend>

            <br>
            <input type="checkbox">
        <br>
        <label >HTML</label>

        <br>
        <br>
        <input type="checkbox">
        <br>
        <label >CSS</label>

        <br>
        <br>
        <input type="checkbox">
        <br>
        <label >JavaScript</label>

        </fieldset>

        <br><br>
        <label for="highereducation">Higher Education :</label>
        <br>
        <select id="highereducation" name="highereducation">
            <option value="highschool">High School</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
            <option value="phd">PhD</option>

        </select>

        <br>
        <br>

        <label for="availability">Availability:</label>
        <br>
        <input type="radio" id="availability" name="availability" >
        <label>Full Time</label>

        <br>
        <br>
        <input type="radio" id="availability" name="availability" >
        <label>Part Time</label>

        <br><br>
        <label for="additionalcomment">Additional Comment :</label>
        <br>
        <input type="text" id="additionalcomment" name="additionalcomment" aria-rowspan="100" aria-colspan="50" style="width:300px; height:100px;">

    </form>

    <h1>Complex Form</h1>

    <form> 

        <fieldset>

            <legend for="personalinfo">Personal Information :</legend>
            <br>

            <label for="name">Name :</label>
        
        <input type="text" id="name" name="name">

        
        <label for="email">Email :</label>
        
        <input type="email" id="email" name="email">

        
        <label for="phone">Phone No. :</label>
    
        <input type="tel" id="phone" name="phone">

        <label for="dob">Date of Birth :</label>
        <input type="date" id="dob" name="dob">

        <label for="gender">Gender :</label>
        <input type="radio" id="gender" name="gender" >
        <label>Male</label>

        <input type="radio" id="gender" name="gender">
        <label>Female</label>

        <label for="Country">Country :</label>
        <select id="Country" name="Country" >
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select>


        </fieldset>
        <br><br>

        <fieldset>

            

            <label for="adress">Adress Street :</label>
            <input type="text" id="adress" name="adress">

            <label for="City">City :</label>
            <input type="text" id="City" name="City">

            <label for="state">State/Province :</label>
            <input type="text" id="state" name="state">

            <label for="zip">ZIP Code :</label>  
            <input type="text" id="zip" name="zip">



        </fieldset>

        <fieldset>
            <legend for="OtherInfomation">Other Information :</legend>
            <br>

            <label for="comments">Comments:</label>
            <textarea type="text" id="comments" name="comments" aria-rowspan="100" aria-colspan="50" style="width:300px; height:100px;">
            </textarea>

            <label>I agree to the terms and comdition </label>
            <input type="checkbox" id="terms" name="terms"> 

            <inmput type="submit" value="Submit"></input> 

        </fieldset>


    </form>


</body>
</html>
